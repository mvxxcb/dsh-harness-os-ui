<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>HARNESSS OS · HOME / 工作台</title>
<link rel="stylesheet" href="styles/tokens.css">
<link rel="stylesheet" href="styles/base.css">
<link rel="stylesheet" href="styles/components.css">
</head>
<body>
<div class="app">

  <!-- 屏幕四角：非常细的 L 型定位角标 -->
  <div class="corners" aria-hidden="true"><i class="tl"></i><i class="tr"></i><i class="bl"></i><i class="br"></i></div>

  <!-- ═══ 侧栏 ═══════════════════════════════════════════════════════════ -->
  <aside class="rail">
    <div class="brand">
      <svg class="brand__mark" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M3 9.5c2.6-3.4 6.2-3.9 9-2.2 2.8 1.7 6.4 1.2 9-2.2" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
        <path d="M12 12.6v5.2M8.6 15.2 12 12.6l3.4 2.6" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span class="brand__name">deepseek</span>
      <span class="brand__badge">HARNESSS</span>
    </div>

    <button class="navitem navitem--primary">
      <svg class="navitem__ico" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M8 3v10M3 8h10" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>
      <span class="navitem__cn">新会话</span>
    </button>

    <div style="height:var(--s2)"></div>

    <button class="navitem">
      <svg class="navitem__ico" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M6 2.5v2M10 2.5v2M4.5 4.5h7v3a3.5 3.5 0 0 1-7 0v-3ZM8 11v2.5" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span class="navitem__cn">插件</span>
      <span class="navitem__en">PLUGINS</span>
    </button>

    <div class="rail__head">
      <span class="rail__head-label">
        <span class="cn">工作区</span>
        <span class="en t-meta">WORKSPACE</span>
      </span>
      <span class="rail__tools">
        <span class="iconbtn" title="搜索"><svg viewBox="0 0 16 16" fill="none"><circle cx="7" cy="7" r="4.2" stroke="currentColor" stroke-width="1.2"/><path d="m10.2 10.2 3 3" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg></span>
        <span class="iconbtn" title="筛选"><svg viewBox="0 0 16 16" fill="none"><path d="M3 5h10M5 8h6M7 11h2" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg></span>
        <span class="iconbtn" title="新建"><svg viewBox="0 0 16 16" fill="none"><path d="M8 3.5v9M3.5 8h9" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg></span>
      </span>
    </div>

    <div class="rail__list">
      <button class="wsitem" aria-current="true">
        <svg class="wsitem__ico" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M2.5 5.2h4l1.2 1.4h5.8v6.2a.8.8 0 0 1-.8.8H3.3a.8.8 0 0 1-.8-.8V5.2Z" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/></svg>
        <span>我的工作区</span>
        <span class="wsitem__meta t-meta">03</span>
      </button>
      <button class="wsitem">
        <svg class="wsitem__ico" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M2.5 5.2h4l1.2 1.4h5.8v6.2a.8.8 0 0 1-.8.8H3.3a.8.8 0 0 1-.8-.8V5.2Z" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/></svg>
        <span>默认工作区</span>
        <span class="wsitem__meta t-meta">01</span>
      </button>
    </div>

    <div class="rail__spring"></div>

    <button class="wsitem wsitem--account">
      <svg class="wsitem__ico" viewBox="0 0 16 16" fill="none" aria-hidden="true"><circle cx="8" cy="6" r="2.4" stroke="currentColor" stroke-width="1.2"/><path d="M3.6 13c.5-2.2 2.3-3.4 4.4-3.4S11.9 10.8 12.4 13" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>
      <span class="wsitem__num">139******62</span>
      <span class="wsitem__meta t-meta">›</span>
    </button>
  </aside>

  <!-- ═══ 主区 ═══════════════════════════════════════════════════════════ -->
  <main class="main">
    <!-- 结构辅助线：与输入框左右边缘精确对齐，形成制图式空间结构 -->
    <div class="guides" aria-hidden="true">
      <i class="v" style="left:calc(50% - 360px)"></i>
      <i class="v" style="left:calc(50% + 360px)"></i>
    </div>

    <!-- 系统信息条 -->
    <div class="sysbar">
      <span class="t-meta t-meta--ink">REV 0.1.0</span>
      <span class="t-meta">·</span>
      <span class="t-meta t-meta--ink">WEB PROFILE</span>
      <span class="ticks" aria-hidden="true"><i></i><i></i><i></i><i class="on"></i><i></i><i></i><i></i><i></i><i></i><i class="on"></i><i></i><i></i></span>
      <span class="spacer"></span>
      <span class="t-meta">SYSTEM READY</span>
      <span class="dot dot--ok" aria-hidden="true"></span>
      <span class="t-meta t-accent t-num" id="clock">18:32:04</span>
    </div>

    <div class="home">
      <!-- Hero：抽象 AI Core / Scanner -->
      <section class="hero">
        <div class="core">
          <svg viewBox="0 0 300 300" aria-hidden="true">
            <!-- 外层：黑色长弧 -->
            <g class="spin-slow" style="transform-origin:150px 150px">
              <circle cx="150" cy="150" r="118" fill="none" stroke="var(--ink)" stroke-width="1.3"
                      stroke-dasharray="168 573.4" stroke-linecap="round" transform="rotate(-34 150 150)"/>
              <circle cx="150" cy="150" r="118" fill="none" stroke="var(--line-l4)" stroke-width="1"
                      stroke-dasharray="46 695.4" stroke-linecap="round" transform="rotate(140 150 150)"/>
            </g>
            <!-- 浅灰中弧（反向） -->
            <g class="spin-slow-rev" style="transform-origin:150px 150px">
              <circle cx="150" cy="150" r="96" fill="none" stroke="var(--ink-4)" stroke-width="1"
                      stroke-dasharray="300 303.2" stroke-linecap="round" transform="rotate(118 150 150)"/>
              <circle cx="150" cy="150" r="76" fill="none" stroke="var(--line-l3)" stroke-width="0.75"
                      stroke-dasharray="196 281.5" stroke-linecap="round" transform="rotate(-96 150 150)"/>
            </g>
            <!-- 内层：更细，部分近白 -->
            <g class="spin-slow" style="transform-origin:150px 150px">
              <circle cx="150" cy="150" r="56" fill="none" stroke="var(--ink-3)" stroke-width="1"
                      stroke-dasharray="126 225.9" stroke-linecap="round" transform="rotate(196 150 150)"/>
              <circle cx="150" cy="150" r="36" fill="none" stroke="var(--ink-4)" stroke-width="0.75"
                      stroke-dasharray="88 138.2" stroke-linecap="round" transform="rotate(-14 150 150)"/>
            </g>
            <!-- 定位节点：弧端点处的小十字/方块 -->
            <g stroke="var(--ink-4)" stroke-width="0.75" fill="none">
              <path d="M150 32v8M146 36h8"/>
              <path d="M246 150h-8M242 146v8"/>
              <path d="M150 268v-8M146 264h8"/>
            </g>
            <!-- 橙色状态点：少量，作为动态节点 -->
            <circle class="pulse" cx="196" cy="86" r="2.6" fill="var(--accent)"/>
            <circle cx="104" cy="196" r="2" fill="var(--accent)" opacity="0.75"/>
            <circle cx="118" cy="92" r="1.6" fill="var(--accent)" opacity="0.5"/>
            <!-- 中央十字准星 -->
            <path d="M150 138v24M138 150h24" stroke="var(--line-l4)" stroke-width="0.75"/>
          </svg>
        </div>

        <h1 class="hero__title">
          <span class="cn">探索未知之境</span>
          <span class="en">EXPLORE THE UNKNOWN</span>
        </h1>
      </section>

      <!-- 输入区 -->
      <section class="composer">
        <div class="composer__box">
          <div class="composer__input">描述你想要构建的内容，例如：构建一个基于知识库的问答系统…</div>
          <div class="composer__bar">
            <button class="composer__plus" title="添加附件">
              <svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M8 3.5v9M3.5 8h9" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>
            </button>
            <span class="composer__chip">
              <svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><circle cx="7" cy="7" r="4.2" stroke="currentColor" stroke-width="1.2"/><path d="m10.2 10.2 3 3" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>
              工作区内搜索
            </span>
            <span class="spacer"></span>
            <span class="composer__model">
              DeepSeek V4.1-Flash
              <svg viewBox="0 0 16 16" fill="none" aria-hidden="true" style="width:10px;height:10px;color:var(--ink-3)"><path d="m5 6.5 3 3 3-3" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </span>
            <button class="composer__send" title="发送">
              <svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M8 12.5V3.5M4.5 7 8 3.5 11.5 7" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
          </div>
        </div>

        <!-- 快捷操作 -->
        <div class="pills">
          <button class="pill">
            <svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M8 10.5V3.2M5.2 6 8 3.2 10.8 6" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M3.2 10.5v2.3h9.6v-2.3" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>
            文件上传
          </button>
          <button class="pill">
            <svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M3 3.4h4.2v9.2H3zM8.8 3.4H13v9.2H8.8" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/></svg>
            知识库
          </button>
          <button class="pill" aria-pressed="true">
            <svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><rect x="2.6" y="3.4" width="10.8" height="9.2" rx="1" stroke="currentColor" stroke-width="1.2"/><circle cx="6.2" cy="6.6" r="1" stroke="currentColor" stroke-width="1"/><path d="m3.4 11.4 3-2.6 2.4 2 1.8-1.4 2 1.8" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/></svg>
            生成图像
          </button>
        </div>
      </section>

      <!-- 底部 HUD -->
      <footer class="hud">
        <div class="hud__row">
          <div class="hud__left">
            <span class="sig" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
            <span class="t-meta t-meta--ink">[ 01 / 06 ] HOME</span>
            <span class="ticks" aria-hidden="true"><i></i><i></i><i class="on"></i><i></i><i></i></span>
          </div>
          <div class="hud__center">
            <span class="cn">等待用户输入…</span>
            <span class="en t-meta">AWAITING USER INPUT</span>
          </div>
          <div class="hud__right">
            <span class="hud__brand">POWERED BY DEEPSEEK</span>
            <span class="hud__mark" aria-hidden="true"></span>
          </div>
        </div>
        <div class="pbar" aria-hidden="true"><b></b><u></u></div>
      </footer>
    </div>
  </main>
</div>

<script>
  // 系统时间：真实走时，默认值与静态稿一致
  (function () {
    var el = document.getElementById('clock');
    if (!el) return;
    function pad(n) { return n < 10 ? '0' + n : String(n); }
    function tick() {
      var d = new Date();
      el.textContent = pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds());
    }
    tick(); setInterval(tick, 1000);
  })();
</script>
</body>
</html>
